[project]
name = "nxai"
version = "0.1.0"
description = "Мультиканальный агрегатор Telegram-контента по темам — core service layer + telethon ingest + bots + api"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<25.0",
    "sentry-sdk>=2.17,<3.0",
    "litellm>=1.52,<2.0",
    "apscheduler>=3.10,<4.0",
    "redis>=5.2,<6.0",
    "telethon>=1.36,<2.0",
    "pyjwt>=2.9,<3.0",
    "bcrypt>=4.2,<6.0",
    "python-multipart>=0.0.12,<1.0",
    "httpx>=0.27,<1.0",
    "cryptography>=44,<46",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    # Минорная версия зафиксирована: в новых минорах ruff добавляет правила в уже
    # выбранные категории, и прогон краснел бы от обновления, а не от кода.
    "ruff>=0.16,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Набор правил задан явно, а не отдан умолчаниям ruff. Умолчания расширяются от версии
# к версии: свежий линтер включил расширенный набор и выдал 1186 замечаний посреди
# задачи про CI, ни одно из которых к ней не относилось.
#
# Здесь перечислено то, на чём проект писался: ошибки импортов и синтаксиса (E4/E7/E9)
# и логические ошибки pyflakes (F). Отдельно отмечу, почему НЕ включены соблазнительные
# семейства:
#   * RUF001–003 «неоднозначные символы юникода» — срабатывают на кириллицу, а весь
#     проект написан по-русски: 980 замечаний на комментарии и строки;
#   * B008 «вызов в значении по умолчанию» — идиома FastAPI `Depends(get_db)`, ею
#     объявлены зависимости во всех роутерах;
#   * BLE001 «широкий except» — осознанный приём: сбой отправки уведомления или карточки
#     не должен ронять пайплайн, и в коде это объяснено в каждом месте.
#
# Расширять набор стоит, но отдельной работой: каждое новое семейство — правки в десятках
# файлов, и мешать их с содержательным изменением нельзя, иначе в диффе не найти, что
# поменялось по делу.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "interfaces"]
